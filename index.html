<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Career Tools V2</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-tabs print-hide">
        <button class="tab-btn active" data-target="editor-panel">📝 Editor</button>
        <button class="tab-btn" data-target="preview-panel">👁️ Preview</button>
    </div>

    <main class="app-shell">
        <section id="editor-panel" class="panel editor-panel active print-hide">
            <h2 class="app-title">CV BUILDER PRO</h2>
            
            <div class="utility-bar">
                <button id="btn-export-json" class="btn-util">⬇️ Backup Data</button>
                <label for="import-json" class="btn-util cursor-pointer">⬆️ Import Data</label>
                <input type="file" id="import-json" accept=".json" style="display:none;">
                <button id="btn-reset" class="btn-util text-red">🗑️ Reset</button>
            </div>

            <div class="form-group" style="margin-top:20px;">
                <label>Pilih Tema / Desain CV (1-15)</label>
                <select id="template" class="input-field select-fw">
                    <optgroup label="ATS Optimized Series">
                        <option value="2">1. ATS Classic Professional</option>
                        <option value="12">2. ATS Executive Clean</option>
                    </optgroup>
                    <optgroup label="Corporate & Finance Series">
                        <option value="5">3. Corporate Letterhead (No Photo)</option>
                        <option value="7">4. Emerald Corporate Minimal</option>
                        <option value="8">5. Ivy League Classic (No Photo)</option>
                    </optgroup>
                    <optgroup label="Hospitality & Service Series">
                        <option value="4">6. Hospitality Warm Amber</option>
                        <option value="9">7. Luxury Gold (Center Photo)</option>
                    </optgroup>
                    <optgroup label="Modern & Creative Series">
                        <option value="1">8. Dark Sidebar Split (Modern)</option>
                        <option value="3">9. Creative Visual (Round Photo)</option>
                        <option value="6">10. Editorial Split (No Photo)</option>
                        <option value="11">11. Right Sidebar Accent</option>
                        <option value="14">12. Vertical Monolith (No Photo)</option>
                        <option value="15">13. Signature Edition (Gold/Black)</option>
                    </optgroup>
                    <optgroup label="Specialized Series">
                        <option value="10">14. Tech Terminal (No Photo)</option>
                        <option value="13">15. Dark Badge Specialist (Square Photo)</option>
                    </optgroup>
                </select>
            </div>

            <div class="accordion-container">
                <div class="acc-item active">
                    <button class="acc-header">👤 Personal Details</button>
                    <div class="acc-body">
                        <div class="form-group"><label>Upload Photo</label><input type="file" id="photo" accept="image/*" class="input-field"></div>
                        <div class="form-group"><label>Full Name</label><input type="text" id="fullName" class="input-field"></div>
                        <div class="form-group"><label>Target Job Title</label><input type="text" id="jobTitle" class="input-field"></div>
                        <div class="form-grid-2">
                            <div class="form-group"><label>Email</label><input type="email" id="email" class="input-field"></div>
                            <div class="form-group"><label>Phone</label><input type="text" id="phone" class="input-field"></div>
                        </div>
                        <div class="form-group"><label>Location</label><input type="text" id="location" class="input-field"></div>
                        <div class="form-group"><label>LinkedIn / Portfolio</label><input type="text" id="linkedin" class="input-field" placeholder="linkedin.com/in/username"></div>
                    </div>
                </div>

                <div class="acc-item">
                    <button class="acc-header">📝 Professional Summary</button>
                    <div class="acc-body">
                        <div class="form-group">
                            <label>Summary (Pitch yourself in 3-4 lines)</label>
                            <textarea id="summary" class="input-field" rows="4"></textarea>
                        </div>
                    </div>
                </div>

                <div class="acc-item">
                    <button class="acc-header">💼 Work Experience</button>
                    <div class="acc-body">
                        <div id="experience-list"></div>
                        <button id="btn-add-exp" class="btn-outline">+ Add Experience</button>
                    </div>
                </div>

                <div class="acc-item">
                    <button class="acc-header">🎓 Education</button>
                    <div class="acc-body">
                        <div id="education-list"></div>
                        <button id="btn-add-edu" class="btn-outline">+ Add Education</button>
                    </div>
                </div>

                <div class="acc-item">
                    <button class="acc-header">🧠 Skills & Languages</button>
                    <div class="acc-body">
                        <div class="form-group"><label>Key Skills</label><textarea id="skills" class="input-field" rows="3"></textarea></div>
                        <div class="form-group"><label>Languages</label><textarea id="languages" class="input-field" rows="2"></textarea></div>
                    </div>
                </div>

                <div class="acc-item">
                    <button class="acc-header">⚙️ Optional Sections</button>
                    <div class="acc-body">
                        <div class="toggle-group">
                            <label><input type="checkbox" id="showObjective"> Show Career Objective</label>
                            <textarea id="careerObjective" class="input-field mt-2 hidden" rows="2"></textarea>
                        </div>
                        <div class="toggle-group mt-3">
                            <label><input type="checkbox" id="showAchievements" checked> Show Achievements</label>
                            <textarea id="achievements" class="input-field mt-2" rows="3"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <button id="btn-print" class="btn-print">⬇️ DOWNLOAD PDF</button>
        </section>

        <section id="preview-panel" class="panel preview-panel">
            <div class="preview-scaler">
                <div id="cv-container" class="cv-page">
                    <!-- Template Rendered Here -->
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Professional Career Tools</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&family=Fira+Code&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Mobile Tabs -->
    <div class="mobile-tabs print-hide">
      <button class="tab-btn active" data-target="editor-panel">
        Editor Form
      </button>
      <button class="tab-btn" data-target="preview-panel">Live Preview</button>
    </div>

    <main class="app-shell">
      <!-- Editor Panel -->
      <section id="editor-panel" class="panel editor-panel active print-hide">
        <div class="visitor-card">
          <div>
            <div class="visitor-title">Visitor Detector</div>
            <div class="visitor-count">
              <span id="visitor-count">285</span> Orang
            </div>
          </div>
          <div class="live-badge">Live Active</div>
        </div>

        <h2 class="app-title">PROFESSIONAL CV MAKER</h2>

        <div class="form-group">
          <label>Pilih dari 15 Template Pilihan</label>
          <select id="template" class="input-field">
            <option value="1">1. Brian Baxter Style (Dark Sidebar)</option>
            <option value="2">2. Corporate Minimalist (ATS Clean)</option>
            <option value="3">3. Creative Visual Elite (Round Photo)</option>
            <option value="4">4. Hospitality Specialist (Warm Amber)</option>
            <option value="5">5. Executive Navy Classic (Top Header)</option>
            <option value="6">6. Modern Split Slate & Teal (Kontras)</option>
            <option value="7">7. Emerald Corporate (Green Accent)</option>
            <option value="8">8. Crimson Executive Bold (Kontras)</option>
            <option value="9">9. Luxury Gold Standard (Serif Premium)</option>
            <option value="10">
              10. Tech & Data Analyst Style (Dark Mono)
            </option>
            <option value="11">11. Steven Terry Style (Right Sidebar)</option>
            <option value="12">12. Senior Supervisor Clean Layout</option>
            <option value="13">13. Matthew Connors Style (Dark Badge)</option>
            <option value="14">14. Modern Creative Grid Minimalist</option>
            <option value="15">
              15. Ultimate Signature Edition (Gold & Black)
            </option>
          </select>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>1. Upload Foto Profil</label
            ><input
              type="file"
              id="photo"
              accept="image/*"
              class="input-field"
            />
          </div>
          <div class="form-group">
            <label>2. Full Name</label
            ><input type="text" id="fullName" class="input-field" />
          </div>
          <div class="form-group">
            <label>3. Role / Job Title</label
            ><input type="text" id="jobTitle" class="input-field" />
          </div>
          <div class="form-group">
            <label>4. Email</label
            ><input type="text" id="email" class="input-field" />
          </div>
          <div class="form-group">
            <label>5. Phone Number</label
            ><input type="text" id="phone" class="input-field" />
          </div>
          <div class="form-group">
            <label>6. Domicile (Location)</label
            ><input type="text" id="location" class="input-field" />
          </div>
          <div class="form-group">
            <label>7. Profile Summary</label
            ><textarea id="summary" class="input-field" rows="4"></textarea>
          </div>
          <div class="form-group">
            <label>8. Career Objective</label
            ><textarea
              id="careerObjective"
              class="input-field"
              rows="3"
            ></textarea>
          </div>
          <div class="form-group">
            <label>9. Work Authorization</label
            ><textarea
              id="workAuthorization"
              class="input-field"
              rows="2"
            ></textarea>
          </div>
          <div class="form-group">
            <label>10. Professional Experience</label
            ><textarea id="experience" class="input-field" rows="5"></textarea>
          </div>
          <div class="form-group">
            <label>11. Achievement & Recognition</label
            ><textarea
              id="achievements"
              class="input-field"
              rows="3"
            ></textarea>
          </div>
          <div class="form-group">
            <label>12. Education</label
            ><textarea id="education" class="input-field" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>13. Key Skills</label
            ><textarea id="skills" class="input-field" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label>14. Languages</label
            ><textarea id="languages" class="input-field" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label>15. Interests</label
            ><textarea id="interests" class="input-field" rows="2"></textarea>
          </div>
          <div class="form-group">
            <label>16. Personal Info</label
            ><textarea
              id="personalInfo"
              class="input-field"
              rows="2"
            ></textarea>
          </div>
          <div class="form-group">
            <label>17. Closing Statement</label
            ><textarea id="statement" class="input-field" rows="2"></textarea>
          </div>
        </div>

        <button id="btn-print" class="btn-print">Export ke PDF / Print</button>
      </section>

      <!-- Preview Panel -->
      <section id="preview-panel" class="panel preview-panel">
        <div class="preview-scaler">
          <div id="cv-container" class="cv-page">
            <!-- Template CV akan di-render di sini oleh JavaScript -->
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
